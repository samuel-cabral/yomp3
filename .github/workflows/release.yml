name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      # Secrets are surfaced at job level so they can be referenced in step `if:`
      # conditionals. (GitHub Actions does not allow `secrets.*` directly in `if:`.)
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: ${GITHUB_REF#refs/tags/} | VERSION file: $VERSION"

      - name: Verify Swift toolchain
        run: swift --version

      - name: Import Developer ID certificate
        if: env.SIGNING_CERTIFICATE_P12_BASE64 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$SIGNING_CERTIFICATE_P12_BASE64" | base64 -d > "$CERT_PATH"
          security import "$CERT_PATH" -P "$SIGNING_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          rm "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: bash Scripts/build-app.sh

      - name: Verify signature
        run: codesign --verify -vvv build/YoMP3.app

      - name: Store notarytool credentials
        if: env.APPLE_API_KEY != ''
        run: |
          KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$KEY_PATH"
          xcrun notarytool store-credentials yomp3-notary \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          rm "$KEY_PATH"
          echo "NOTARY_PROFILE=yomp3-notary" >> "$GITHUB_ENV"

      - name: Package DMG
        run: bash Scripts/package-dmg.sh

      - name: Generate checksums
        run: |
          cd build
          shasum -a 256 YoMP3.dmg > YoMP3.dmg.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: YoMP3 ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            build/YoMP3.dmg
            build/YoMP3.dmg.sha256

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true
