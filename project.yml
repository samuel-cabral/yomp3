name: YoMP3
options:
  bundleIdPrefix: com.samuelcabral
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  YoMP3:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/yomp3
        type: group
    resources:
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: YoMP3
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelcabral.yomp3
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/yomp3.entitlements
        CODE_SIGN_STYLE: Automatic
        # Fill in your 10-character Apple Developer Team ID here, e.g. "A1B2C3D4E5"
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

schemes:
  YoMP3:
    build:
      targets:
        YoMP3: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
